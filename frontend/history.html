<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History — Why It's Messy</title>
  <link rel="stylesheet" href="/static/css/main.css?v=3">
  <style>
    .page-header { padding: var(--space-3xl) 0 var(--space-xl); }
    .page-header h1 { font-family: var(--font-display); font-size: 4rem; margin-bottom: var(--space-xs); }
    .table-container { background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: var(--space-md) var(--space-xl); background: var(--canvas-alt); font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); border-bottom: 1px solid var(--border); }
    td { padding: var(--space-md) var(--space-xl); font-size: var(--text-sm); border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: var(--canvas-alt); }
    .empty-state { text-align: center; padding: var(--space-4xl) var(--space-xl); color: var(--ink-muted); }
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <main class="container">
    <div class="page-header">
      <h1>Scan History</h1>
      <p style="color:var(--ink-secondary); font-size:var(--text-lg);">Your past detection results.</p>
    </div>
    
    <div class="table-container">
      <table id="history-table">
        <thead><tr><th>Type</th><th>Preview</th><th>Verdict</th><th>Date</th><th>Action</th></tr></thead>
        <tbody id="history-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">
        <div style="font-size:3rem; margin-bottom:var(--space-md);">📭</div>
        <p>No scans yet. Run your first detection!</p>
      </div>
    </div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/static/js/navigation.js?v=3"></script>
  <script>
    async function fetchHistory() {
      try {
        const res = await fetch('/api/history?limit=50');
        const data = await res.json();
        const tbody = document.getElementById('history-body');
        const scans = data.scans || [];
        if (scans.length === 0) { 
          document.getElementById('history-table').style.display='none'; 
          document.getElementById('empty-state').style.display='block'; 
          return; 
        }
        
        // Basic HTML escaping
        const escapeHtml = (unsafe) => {
          return (unsafe || '').replace(/&/g, "&amp;")
                               .replace(/</g, "&lt;")
                               .replace(/>/g, "&gt;")
                               .replace(/"/g, "&quot;")
                               .replace(/'/g, "&#039;");
        };

        tbody.innerHTML = scans.map(item => `
          <tr>
            <td><span class="badge badge-detect">${escapeHtml(item.detection_type)}</span></td>
            <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(item.input_preview)}">${escapeHtml(item.input_preview)}</td>
            <td><strong>${escapeHtml(item.verdict)}</strong></td>
            <td>${new Date(item.created_at).toLocaleDateString()}</td>
            <td>
                <a href="/results?id=${item.id}" class="btn btn-sm btn-secondary">View</a>
                <button onclick="deleteScan(${item.id})" class="btn btn-sm" style="color:var(--danger); border-color:var(--danger);">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch(e) { console.error(e); }
    }
    
    async function deleteScan(id) {
        if (!confirm('Delete this scan?')) return;
        try {
            await fetch('/api/history/' + id, { method: 'DELETE' });
            fetchHistory();
        } catch(e) { console.error(e); }
    }
    
    fetchHistory();
  </script>
</body>
</html>
